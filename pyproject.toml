[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cairn-coordination"   # PyPI distribution name ("cairn" is taken); import stays `import cairn`
version = "0.3.0"
description = "Coordination layer for multi-agent AI: agents converge on a passive append-only blackboard (auditable, no silent overwrites) with minimal per-agent context — optional on-chain verifiable receipts + ERC-8004 identity."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{ name = "Tağmaç Çankaya" }]
keywords = ["multi-agent", "agents", "llm", "coordination", "token-efficiency",
            "blackboard", "stigmergy", "erc-8004", "celo", "web3", "agent-economy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []   # CORE is stdlib-only — `pip install cairn` stays dependency-free (by design).

[project.optional-dependencies]
web3 = ["web3>=7,<8", "eth-account"]            # cairn-coordination[web3] — the on-chain layer
langchain = ["langchain-core"]                  # cairn-coordination[langchain] — LangChain/LangGraph adapter
crewai = ["crewai"]                             # cairn-coordination[crewai] — CrewAI adapter
dev  = ["web3>=7,<8", "eth-account", "py-solc-x", "eth-tester", "py-evm", "pytest"]

[project.urls]
Homepage = "https://github.com/echo-toolkit/cairn"
Repository = "https://github.com/echo-toolkit/cairn"

[tool.setuptools]
packages = ["cairn", "cairn.web3", "cairn.adapters"]
